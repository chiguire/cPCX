- hosts: vps
  tasks:
    - name: Refuse to delete the database without explicit confirmation
      fail:
        msg: "redeploy_db deletes the production database; run ./redeploy_cpcx.sh --reset-db (it asks for confirmation)."
      when: (redeploy_db | default(false) | bool) and (confirm_wipe | default('no')) != 'yes'

    - name: Checkout release branch
      git:
        repo: "{{ github_repo }}"
        dest: ~/app
        version: release
        accept_hostkey: yes
        force: true
        key_file: ~/.ssh/id_ed25519

    - name: Update .env settings
      no_log: true
      lineinfile:
        path: ~/app/deploy/docker/.env
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: SMTP_HOST,                 value: "{{ smtp_host }}" }
        - { key: SMTP_USERNAME,             value: "{{ smtp_username }}" }
        - { key: SMTP_PASSWORD,             value: "{{ smtp_password }}" }
        - { key: CARETAKER_EMAIL,           value: "{{ caretaker_email }}" }
        - { key: DATA_PROTECTION_KEYS_PATH, value: "{{ data_protection_keys_path }}" }

    - name: Stop cpcx service
      shell: systemctl --user stop cpcx
      environment:
        XDG_RUNTIME_DIR: /run/user/{{ ansible_user_uid }}

    - name: Delete postgres data directory
      become: true
      file:
        path: "{{ postgres_data_path }}"
        state: absent
      when: redeploy_db | default(false) | bool

    - name: Delete migrations directory
      file:
        path: ~/app/cpcx/Migrations
        state: absent
      when: redeploy_db | default(false) | bool

    - name: Ensure init-db.sh is executable
      file:
        path: ~/app/deploy/docker/init-db.sh
        mode: u+x
      when: redeploy_db | default(false) | bool

    - name: Initialise database
      shell:
        cmd: ~/app/deploy/docker/init-db.sh InitialMigration
        chdir: ~/app/deploy/docker
      when: redeploy_db | default(false) | bool

    # The container now runs as uid 1654 (non-root) instead of root. In rootless
    # Docker that uid maps to a sub-uid on the host, so the key ring directory
    # (created earlier by the old root container, i.e. owned by this user) must
    # be re-owned from INSIDE the user namespace. Idempotent; also locks the
    # directory down to the app (mode 700) since the key ring signs auth cookies.
    - name: Make the data protection keys dir owned by the container's app user
      shell: |
        set -e
        # Same fallback as docker-compose.yml (${DATA_PROTECTION_KEYS_PATH:-~/dataprotection-keys});
        # the variable is empty when it is missing from deploy/secrets.
        KEYS="{{ data_protection_keys_path | default('', true) | trim or '~/dataprotection-keys' }}"
        KEYS="${KEYS/#\~/$HOME}"
        mkdir -p "$KEYS"
        docker run --rm -u 0 --network none --cap-drop ALL \
          --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER \
          --entrypoint /bin/sh -v "$KEYS:/keys" \
          mcr.microsoft.com/dotnet/aspnet:10.0-alpine -c '
            if [ -n "$(find /keys ! -user 1654 | head -1)" ] || [ "$(stat -c %a /keys)" != "700" ]; then
              chown -R 1654:1654 /keys && chmod 700 /keys && echo CHANGED
            fi'
      args:
        executable: /bin/bash
      environment:
        DOCKER_HOST: "unix:///run/user/{{ ansible_user_uid }}/docker.sock"
      register: keys_owner
      changed_when: "'CHANGED' in keys_owner.stdout"

    - name: Restart cpcx service
      shell: systemctl --user restart cpcx
      environment:
        XDG_RUNTIME_DIR: /run/user/{{ ansible_user_uid }}