services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    # Hardening: the entrypoint starts as root only to fix data-dir ownership
    # and then drops to the postgres user (gosu), so keep just those caps.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cpcx}
      POSTGRES_USER: ${POSTGRES_USER:-cpcx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${POSTGRES_DATA_PATH:-~/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  cpcx:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.cpcx
      args:
        PROJECT_PATH: ${CPCX_PROJECT_PATH:-cpcx}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    # Hardening. The app only ever writes to /keys (the volume below) and
    # .NET's scratch files in /tmp, so everything else can be read-only.
    # The image runs as non-root (USER $APP_UID in Dockerfile.cpcx).
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${DATA_PROTECTION_KEYS_PATH:-~/dataprotection-keys}:/keys
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DOTNET_EnableDiagnostics: "0"   # no diagnostic IPC sockets in /tmp
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Cpcx__CaretakerEmail: ${CARETAKER_EMAIL:-}
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;
        Database=${POSTGRES_DB:-cpcx};
        Username=${POSTGRES_USER:-cpcx};
        Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge
